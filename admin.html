<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Register Surat Keluar Rutan Sinjai</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { 
      background-color: #0b2545; /* Menyamakan latar belakang biru tua khas halaman utama */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    .main-card { 
      border: none; 
      border-radius: 16px; 
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15); 
      background: #ffffff;
    }
    .table-header-custom {
      background-color: #0b2545;
      color: white;
    }
    .table-hover tbody tr:hover {
      background-color: #f1f5f9;
    }
    .form-control {
      border-radius: 8px;
      padding: 10px 15px;
      border: 1px solid #cbd5e1;
    }
    .form-control:focus {
      border-color: #0b2545;
      box-shadow: 0 0 0 0.2rem rgba(11, 37, 69, 0.25);
    }
  </style>
</head>
<body>

  <!-- Navbar / Header Atas -->
  <div class="container pt-4 mb-3">
    <div class="d-flex justify-content-between align-items-center px-2">
      <h3 class="text-white fw-bold mb-0"><i class="fa-solid fa-gauge-high me-2"></i> Panel Admin Surat Keluar</h3>
      <a href="index.html" class="btn btn-light btn-sm fw-semibold px-3 py-2 shadow-sm" style="border-radius: 8px;">
        <i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Form Input
      </a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="container pb-5">
    
    <!-- Kotak Pencarian & Info -->
    <div class="card main-card p-4 mb-4">
      <div class="row align-items-center">
        <div class="col-md-6 mb-3 mb-md-0">
          <h5 class="mb-1 text-dark fw-bold">Daftar Arsip Surat Keluar</h5>
          <p class="text-muted mb-0 small">Kelola, pantau, dan telusuri data register surat yang tersimpan di database.</p>
        </div>
        <div class="col-md-6">
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0" style="border-radius: 8px 0 0 8px;"><i class="fa-solid fa-magnifying-glass text-muted"></i></span>
            <input type="text" id="searchInput" class="form-control border-start-0" placeholder="Cari nomor surat, pembuat, atau tujuan..." style="border-radius: 0 8px 8px 0;">
          </div>
        </div>
      </div>
    </div>

    <!-- Tabel Data -->
    <div class="card main-card p-3">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-header-custom">
            <tr>
              <th class="py-3 rounded-start">No</th>
              <th class="py-3">Nomor Surat</th>
              <th class="py-3">Pembuat</th>
              <th class="py-3">Tujuan</th>
              <th class="py-3">Tanggal</th>
              <th class="py-3">Kode</th>
              <th class="py-3 text-center rounded-end">Aksi</th>
            </tr>
          </thead>
          <tbody id="tabelSuratBody">
            <tr>
              <td colspan="7" class="text-center py-4 text-muted">Memuat data dari database...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Skrip Admin -->
  <script src="admin.js"></script>
</body>
</html>
