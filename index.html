<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Gambar -->
  <!-- Pastikan posisinya seperti ini -->
<div class="gambar">
  <img src="./assets/Logo-Kementrian-Imigrasi-dan-Pemasyarakatan.png" alt="Logo Kemenimipas">
  <img src="./assets/Logo-Pas.png" alt="Logo Pemasyarakatan">
</div>

<!-- Form Inputan -->
<h3 class="title">REGISTER SURAT KELUAR <br> RUTAN KELAS IIB SINJAI</h3>

<div class="container">
  <a href="panduan/KODE KLASIFIKASI SURAT 2026.pdf" target="_blank">Panduan Klasifikasi Surat</a>
  <br>
  <br>
  <form action="/action_page.php" name="Agenda-Surat-Keluar">
    <label for="namaPegawai">Pembuat Surat</label>
    <input type="text" id="namaPegawai" name="pembuat-surat" placeholder="Nama Anda" required>

<!-- Tujuan Surat -->
<br>
    <div>
    <label for="tujuanSurat">Tujuan Surat</label>
    <input type="text" id="tujuanSurat" name="tujuan-surat" placeholder="Tujuan Surat" required>
    </div>

<!-- Tanggal Surat -->
<label for="tanggalSurat">Tanggal Surat</label>
<input type="date" name="tanggal-surat" id="tanggalSurat" required>

<br>
<br>
<!-- Perihal -->
 <div>
  <label for="perihal">Perihal</label>
  <input type="text" placeholder="Isikan perihal surat..." name="perihal" required>
 </div>

  <!--Tembusan  -->
  <div>
  <label for="tembusan">Tembusan (Opsional)</label>
  <input type="text" placeholder="Tembusan" name="tembusan">
 </div>

 <!-- Sub Pilihan -->
    <!-- Dropdown 1: Kode Utama -->
<div class="form-group">
    <label for="kodeUtama">Kode Surat Utama</label>
    <select id="kodeUtama" name="kode-surat" onchange="updateSubKode()" required>
      <option value="">-- Pilih Kode Utama --</option>
      <option value="PR">Perencanaan (PR)</option>
      <option value="KU">Keuangan (KU)</option>
      <option value="OT">Organisasi dan Tatalaksana (OT)</option>
      <option value="SA">Sumber Daya Manusia Aparatur (SA)</option>
      <option value="PB">Pengelolaan Barang Milik Negara (PB)</option>
      <option value="KS">Kerja Sama (KS)</option>
      <option value="HK">Hukum (HK)</option>
      <option value="UM">Umum (UM)</option>
      <option value="PW">Pengawasan (PW)</option>
      <option value="TI">Teknologi Informasi (TI)</option>
      <option value="PK">Pemasyarakatan (PK)</option>
      <option value="GR">Keimigrasian (GR)</option>
      <option value="SM">Sumber Daya Manusia Imigrasi dan Pemasyarakatan (SM)</option>
      <option value="PS">Pusat Strategi Kebijakan (PS)</option>
    </select>
  </div>

  <!-- Inputan Sub-Kode (Opsi berubah tergantung Pilihan Utama) -->
  <div class="form-group">
    <label for="subKode">Sub-Kode / Klasifikasi Surat</label>
    <select id="subKode" name="klasifikasi-surat"  onchange="generateNomorSurat()" disabled required>
      <option value="">-- Pilih Kode Utama Terlebih Dahulu --</option>
    </select>
  </div>

  <!-- Jenis Surat -->
 <div class="form-group">
      <label for="jenisSurat">Jenis Surat</label>
      <select id="jenisSurat" name="jenis-surat" onchange="generateNomorSurat()" required>
        <option value="">-- Pilih Kode Utama Terlebih Dahulu --</option>
        <option value="UMUM">Surat Umum</option>
        <option value="SK">SK (Surat Keputusan)</option>
      </select>
    </div>

  <!-- Nomor Surat Otomatis -->

<div class="form-group">
  <label>Nomor Surat</label>
  <!-- Hapus name="nomor-surat" dari div ini -->
  <div id="nomorSuratBox" class="nomor-surat-box empty">
    Pilih Sub-Kode Surat
  </div>
  
  <!-- Tambahkan input hidden ini untuk menampung data ke Google Sheets -->
  <input type="hidden" id="nomorSuratInput" name="nomor-surat">
</div>

<br>

<!-- Penyesuaian Inputan -->

<div>
  <label>
    <input type="checkbox" required  style="cursor: pointer;">
    Apakah Anda Telah Yakin dengan Inputan Anda?
  </label>
</div>

<br>


  <!-- file submit -->

    <button type="submit" class="btn btn-primary btn-kirim">Simpan dan gunakan nomor</button>
    <button class="btn btn-primary btn-loading d-none" type="button" disabled>
  <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
  <span role="status">Loading...</span>
</button>
  </form>
</div>

</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="index.js"></script>
</html>
